
services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"   
      - "9001:9001"   
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-stockly}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-stockly-secret-123}
      
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CLIENT_ORIGIN:-http://localhost:5173}
    volumes:
      - rustfs-data:/data
    restart: unless-stopped
 
volumes:
  rustfs-data: